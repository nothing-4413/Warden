# Warden 全栈：应用 + 本地 Ollama（含首次模型拉取）+ Prometheus（采集 /metrics + 失败率告警）+ Grafana（可视化）。
# 一键起全栈：cd deploy && docker compose up -d --build
#   - Warden 控制台 http://localhost:8000
#   - Ollama        http://localhost:11534（默认映射到 11534，避开本机可能已装的 Ollama 的 11434；
#                   容器内仍是 11434，app 走服务名 ollama:11434。模型缓存在命名卷 ollama-models）
#   - Prometheus    http://localhost:9090
#   - Grafana       http://localhost:3000（admin / admin，首次登录会要求改密）
#
# 首次启动会在后台拉取对话模型与嵌入模型（默认 qwen2.5:7b + nomic-embed-text，约 5 GB），
# 进度看：docker compose logs -f ollama-pull
# 模型拉完之前对话会报 model not found，属正常现象；拉完后无需重启 app。
#
# 用远程 LLM / 宿主机的 Ollama 时，在 shell 或 deploy/.env 里设 WARDEN_LLM_BASE_URL，
# 并且不启动 Ollama 容器（--no-deps 会跳过 app 依赖的服务）：
#   docker compose up -d --build app prometheus grafana --no-deps
#
# 只想起监控、应用在宿主机用 uvicorn 跑：docker compose up -d prometheus grafana
# （同时把 prometheus/prometheus.yml 的 targets 改成 host.docker.internal:8000）
services:
  # 本地推理服务。compose 网络内 app 通过服务名 ollama:11434 访问，不依赖宿主机装没装 Ollama。
  ollama:
    image: ollama/ollama:${WARDEN_OLLAMA_VERSION:-latest}
    restart: unless-stopped
    ports:
      # 默认发布到宿主机 11534：本机 11434 常常已被原生 Ollama 占用，绑 11434 会让一键启动失败。
      # 11434 空闲且想用惯例端口：WARDEN_OLLAMA_PORT=11434 docker compose up -d --build。
      # app 走的是服务名 ollama:11434，不受这个宿主机映射影响。
      - "127.0.0.1:${WARDEN_OLLAMA_PORT:-11534}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      # 镜像里自带 ollama CLI，能列出模型说明服务端已就绪
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # GPU 加速走叠加文件（默认注释，避免没装 NVIDIA Container Toolkit 的机器直接起不来）：
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    # 纯 CPU 也是能跑的，只是 7B 大约 13 tok/s（本项目实测），开 GPU 后 44 tok/s。
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 一次性初始化容器：等 Ollama 就绪后，把对话模型和嵌入模型拉进 ollama-models 卷。
  # 模型名取自仓库根目录 .env（WARDEN_LLM_MODEL / WARDEN_EMBEDDING_MODEL），
  # 也可以用环境变量 WARDEN_OLLAMA_MODELS="a,b"（shell 或 deploy/.env，根目录 .env 不参与 compose 插值）
  # 显式指定预拉列表；注意它只决定拉哪些模型，app 实际用哪个仍由 WARDEN_LLM_MODEL 决定。
  # 拉完即退出，ps 里显示 Exited (0) 是正常的。失败后重跑：docker compose up -d ollama-pull
  ollama-pull:
    image: ollama/ollama:${WARDEN_OLLAMA_VERSION:-latest}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    # 与 app 读同一份 .env，保证「拉下来的模型」就是「app 要用的模型」
    env_file:
      - path: ../.env
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
      # 留空 = 退回 .env 里的 WARDEN_LLM_MODEL / WARDEN_EMBEDDING_MODEL（再缺省 qwen2.5:7b / nomic-embed-text）
      WARDEN_OLLAMA_MODELS: ${WARDEN_OLLAMA_MODELS:-}
    volumes:
      # 拉取逻辑单独放脚本，方便本地用 sh 跑一遍；entrypoint 直接执行它
      - ./ollama-pull.sh:/usr/local/bin/ollama-pull.sh:ro
    # 显式覆盖镜像自带的 `ollama serve` 入口，避免 CMD 的 serve 被追加进来
    entrypoint: ["/bin/sh"]
    command: ["/usr/local/bin/ollama-pull.sh"]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: warden:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    # 读取仓库根目录的 .env；没有该文件时按 config.py 的默认值运行
    env_file:
      - path: ../.env
        required: false
    environment:
      # 默认连同一 compose 网络里的 ollama 服务（容器里的 localhost 是容器自己）。
      # 用远程 LLM / 宿主机的 Ollama 时，在 shell 或 deploy/.env 里设 WARDEN_LLM_BASE_URL 覆盖，
      # 例如 http://host.docker.internal:11434/v1。
      WARDEN_LLM_BASE_URL: ${WARDEN_LLM_BASE_URL:-http://ollama:11434/v1}
      # 嵌入也必须指回 ollama：根目录 .env 里为「宿主机 llama.cpp」写的是 127.0.0.1:11501，
      # 在容器里那是容器自己，直接复制过去会让 search_notes / index-notes 全部连不上。
      WARDEN_EMBEDDING_BASE_URL: ${WARDEN_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      WARDEN_API_HOST: 0.0.0.0
    depends_on:
      ollama:
        condition: service_healthy
    # Docker Desktop（Windows/macOS）自带 host.docker.internal；Linux 需要这一行
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - warden-data:/app/data
      - warden-reports:/app/reports
      # 想让容器索引本机笔记时，挂进来并把 WARDEN_NOTES_DIR 指向容器内路径：
      # - C:/notes:/notes:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    # 钉 11.6.0：grafana:latest（13.2.x）在本机会反复重启内置数据源插件
    # （日志 "plugin process exited" → level=error "Could not find plugin definition for data source"），
    # 表现为面板全 "No data"；11.6.0 实测能出数。
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # 数据源与「Warden 概览」仪表盘都随 compose 自动加载，登录即可看图
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  warden-data:
  warden-reports:
  ollama-models:

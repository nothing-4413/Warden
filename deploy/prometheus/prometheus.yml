global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: warden
    metrics_path: /metrics
    static_configs:
      # 应用与 Prometheus 同在一个 compose 网络（默认）：用服务名 app。
      # 若应用在宿主机用 uvicorn 跑，改成 ["host.docker.internal:8000"]，
      # 并给 prometheus 服务加 extra_hosts: ["host.docker.internal:host-gateway"]（Linux）。
      - targets: ["app:8000"]

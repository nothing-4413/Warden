name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # ruff 固定到本地格式化使用的版本：升级会改动格式，需与代码一起提交
      - run: pip install ruff==0.16.10
      - run: ruff format --check .
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # 依赖走 uv.lock：CI 装的就是本地锁定过的同一批版本
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      # 实网回归（live marker）不选：需要真实网关，由环境变量门控
      - run: uv run --no-sync pytest -q -m "not live" --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 只验证镜像能构建（不推送）：Dockerfile 跑不起来时，这里是唯一的自动化拦截
      - run: docker build -t warden:ci .

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warden"
version = "0.2.0"
description = "Warden — 自托管个人 Agent 工作台"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 写错 marker / ini 选项直接报错，而不是悄悄跳过
addopts = "--strict-markers --strict-config"
markers = [
    "live: 需要真实外部服务（InferGate / mock 上游）——由环境变量门控，默认跳过",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
# 行宽交给 ruff format 折行；E501 关闭，避免长中文字符串/URL 无法折行导致误报
line-length = 100
extend-exclude = ["app/static"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF100", "RUF022"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
